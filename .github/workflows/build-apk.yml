name: Pinkora PDF - Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify Pinkora PDF debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Locate Android project (source ZIP or extracted project)
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR=""

          # Option 1: source ZIP uploaded anywhere near the repository root.
          SOURCE_ZIP="$(find . -maxdepth 4 -type f -iname 'PinkoraPDF-Android-Source.zip' -not -path './.git/*' -print -quit || true)"
          if [ -n "$SOURCE_ZIP" ]; then
            echo "Found source archive: $SOURCE_ZIP"
            mkdir -p "$RUNNER_TEMP/pinkora-source"
            unzip -q "$SOURCE_ZIP" -d "$RUNNER_TEMP/pinkora-source"
            SETTINGS_FILE="$(find "$RUNNER_TEMP/pinkora-source" -type f -name settings.gradle.kts -print -quit || true)"
            if [ -n "$SETTINGS_FILE" ]; then
              PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
            fi
          fi

          # Option 2: extracted project folder uploaded to the repository.
          if [ -z "$PROJECT_DIR" ]; then
            SETTINGS_FILE="$(find . -type f -name settings.gradle.kts -not -path './.git/*' -not -path './.gradle/*' -print -quit || true)"
            if [ -n "$SETTINGS_FILE" ]; then
              PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
            fi
          fi

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] || [ ! -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" ]; then
            echo '::error::Pinkora Android project was not found.'
            echo 'Upload PinkoraPDF-Android-Source.zip to the repository, OR upload the extracted PinkoraPDF folder.'
            echo 'The ZIP must contain PinkoraPDF/settings.gradle.kts and PinkoraPDF/app/build.gradle.kts.'
            echo 'Files currently visible in the repository:'
            find . -maxdepth 4 -type f -not -path './.git/*' | sort | head -200
            exit 1
          fi

          echo "Using Android project directory: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android SDK Platform 36 and Build Tools 36.0.0
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic

      - name: Run unit tests and build debug APK
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail
          gradle -p "$PROJECT_DIR" --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Verify APK package and version metadata
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo '::error::Android SDK root environment variable was not set.'
            exit 1
          fi
          AAPT="$SDK_ROOT/build-tools/36.0.0/aapt"
          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | grep -F "name='com.quantexapp.pinkorapdf.app'"
          echo "$BADGING" | grep -F "versionCode='1'"
          echo "$BADGING" | grep -F "versionName='Long Star ONE'"
          {
            echo '### Pinkora PDF APK build result'
            echo '- Package: `com.quantexapp.pinkorapdf.app`'
            echo '- Version: `Long Star ONE` (code 1)'
            echo "- APK size: $(du -h "$APK" | cut -f1)"
            echo "- SHA-256: `$(sha256sum "$APK" | cut -d' ' -f1)`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        uses: actions/upload-artifact@v7.0.2
        with:
          path: ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 14
